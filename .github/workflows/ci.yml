name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin package
        run: npm run build

      - name: Behavior tests (host mock + fake Apple API)
        run: npm test

      - name: Verify artifact & hashes
        run: npm run verify

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: apple-music-sync-plugin
          path: dist/*.jsplugin.zip
          if-no-files-found: error
          retention-days: 14
